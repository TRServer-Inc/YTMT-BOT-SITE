<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTMT-BOT - Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #fff;
      padding: 30px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn {
      background: #5865F2;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn:hover {
      background: #4752C4;
    }
    .btn-danger {
      background: #ef4444;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .user-info img {
      border-radius: 50%;
      width: 64px;
      height: 64px;
      border: 2px solid #5865F2;
    }
    .hidden {
      display: none;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YTMT-BOT Kontrol Paneli</h1>
    <p><a href="index.html">← Ana Sayfaya Dön</a></p>

    <!-- Giriş Yapılmadığında Görünen Kısım -->
    <div id="login-section" class="card">
      <h2>Hoş Geldin!</h2>
      <p>Bot ayarlarını yönetmek ve profilini görmek için Discord hesabınla giriş yapman gerekiyor.</p>
      <br>
      <a id="login-btn" class="btn" href="#">Discord ile Giriş Yap</a>
    </div>

    <!-- Giriş Yapıldığında Görünen Kısım -->
    <div id="dashboard-section" class="card hidden">
      <div class="user-info">
        <img id="user-avatar" src="" alt="Avatar">
        <div>
          <h2 id="user-name" style="margin: 0;">Yükleniyor...</h2>
          <p id="user-id" style="color: #94a3b8; margin: 5px 0 0 0;"></p>
        </div>
      </div>
      <br><hr style="border-color: #334155;"><br>
      <h3>Sunucuların ve Bot Ayarları</h3>
      <p>Sistem aktif, giriş yapıldı.</p>
      <br>
      <button id="logout-btn" class="btn btn-danger">Çıkış Yap</button>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
