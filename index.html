<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTMT-BOT - Ana Sayfa</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 90%;
    }
    h1 {
      margin-bottom: 10px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .btn {
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s ease;
      display: inline-block;
    }
    .btn-invite {
      background: #5865F2;
    }
    .btn-invite:hover {
      background: #4752C4;
    }
    .btn-dashboard {
      background: #0284c7;
    }
    .btn-dashboard:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YTMT-BOT</h1>
    <p>discord sunucunu kolayca yönet ve özelleştir!</p>

    <div class="btn-container">
      <!-- CLIENT_ID yazan yere botunun id'sini gir -->
      <a href="https://discord.com/oauth2/authorize?client_id=1234567890123456789&permissions=8&scope=bot%20applications.commands" target="_blank" class="btn btn-invite">
        🤖 Botu Sunucuna Ekle
      </a>

      <a href="dashboard.html" class="btn btn-dashboard">
        🎛️ Dashboard / Giriş Yap
      </a>
    </div>
  </div>

</body>
</html>
